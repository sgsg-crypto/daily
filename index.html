<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>포켓몬 트레이너 훈련 일지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 구글 웹폰트 (주아 & 고운돋움) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
        }

        h1, h2, h3, .font-title {
            font-family: 'Jua', sans-serif;
            letter-spacing: 0.5px;
        }

        @keyframes rainbow-glow {
            0% { filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.6)) drop-shadow(0 0 10px rgba(255, 255, 0, 0.6)); }
            33% { filter: drop-shadow(0 0 6px rgba(0, 255, 128, 0.6)) drop-shadow(0 0 10px rgba(0, 200, 255, 0.6)); }
            66% { filter: drop-shadow(0 0 6px rgba(200, 0, 255, 0.6)) drop-shadow(0 0 10px rgba(255, 0, 150, 0.6)); }
            100% { filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.6)) drop-shadow(0 0 10px rgba(255, 255, 0, 0.6)); }
        }
        
        @keyframes sparkle-float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-4px) scale(1.2); opacity: 1; }
        }

        .pikachu-rainbow-glow { animation: rainbow-glow 3s infinite alternate; }
        .sparkle-effect { animation: sparkle-float 1.5s infinite ease-in-out; }
        .silhouette { filter: brightness(0); }

        /* 아이패드 터치 및 스크롤 최적화 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        button, input { touch-action: manipulation; }
    </style>
</head>
<body class="bg-sky-100 text-slate-800 h-screen flex flex-col overflow-hidden select-none">

    <!-- 상단 헤더 -->
    <header class="bg-gradient-to-r from-yellow-300 via-amber-200 to-yellow-300 border-b-2 border-yellow-400 px-4 py-2 flex-shrink-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
            
            <!-- 프로필 -->
            <div class="flex items-center gap-2.5">
                <div class="relative w-10 h-10 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-red-400 via-green-400 to-blue-400 blur-sm opacity-80 animate-pulse"></div>
                    <div class="relative w-9 h-9 bg-white rounded-full border-2 border-yellow-400 flex items-center justify-center shadow-inner">
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" 
                             alt="Pikachu" class="w-8 h-8 object-contain pikachu-rainbow-glow relative z-10">
                    </div>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg text-amber-950 leading-tight">⚡ 포켓몬 트레이너 훈련장</h1>
                    <p class="text-[11px] text-amber-800/90 font-bold hidden sm:block">오늘도 목표를 달성해보자!</p>
                </div>
            </div>

            <!-- 날짜 이동 컨트롤러 (실시간 오늘 날짜 자동 반영) -->
            <div class="flex items-center gap-1.5 bg-white/90 px-3 py-1 rounded-xl border border-amber-300 shadow-sm">
                <button onclick="changeDate(-1)" class="px-2 py-0.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg text-xs font-bold transition font-title">◀ 이전</button>
                <div class="text-center px-1">
                    <span id="current-date-display" class="text-xs sm:text-sm text-amber-950 font-title block leading-none"></span>
                </div>
                <button onclick="changeDate(1)" class="px-2 py-0.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg text-xs font-bold transition font-title">다음 ▶</button>
                <button onclick="resetToToday()" class="ml-1 text-[10px] text-amber-700 bg-amber-200/60 px-1.5 py-0.5 rounded font-bold">오늘</button>
            </div>

            <!-- 몬스터볼 카운터 & 던지기 버튼 -->
            <div class="flex items-center gap-2">
                <div class="bg-white/90 px-3 py-1 rounded-full border border-red-400 flex items-center gap-1 shadow-sm font-title">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Pokeball" class="w-4 h-4 animate-bounce">
                    <span id="ball-count" class="text-lg text-red-500">0</span>
                    <span class="text-[10px] text-slate-400">/100</span>
                </div>
                <button id="catch-btn" onclick="openCatchModal()" disabled 
                        class="bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-400 disabled:from-slate-300 disabled:to-slate-400 disabled:text-slate-500 text-white text-xs px-3 py-1.5 rounded-xl shadow border border-white transition font-title">
                    🎾 전설 잡기!
                </button>
            </div>
        </div>
    </header>

    <!-- 네비게이션 탭 -->
    <nav class="flex justify-center bg-white border-b border-sky-200 text-sm font-title shadow-sm flex-shrink-0">
        <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-2 text-sky-600 border-b-2 border-sky-500 bg-sky-50">오늘의 훈련</button>
        <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-2 text-slate-400 hover:text-sky-500">훈련 달력</button>
        <button onclick="switchTab('pokedex')" id="tab-pokedex" class="flex-1 py-2 text-slate-400 hover:text-sky-500">전설 도감</button>
        <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-2 text-slate-400 hover:text-sky-500">훈련 설정</button>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-6xl w-full mx-auto p-3 flex-1 overflow-hidden">

        <!-- 1. 오늘의 퀘스트 섹션 -->
        <section id="sec-today" class="h-full overflow-y-auto pr-1">
            <div id="quest-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </section>

        <!-- 2. 달력 기록 섹션 -->
        <section id="sec-calendar" class="hidden bg-white p-4 rounded-2xl border-2 border-sky-200 shadow-md h-full flex flex-col">
            <h2 class="text-base text-sky-700 mb-2 flex items-center gap-2">
                <span>📅</span> 훈련 달력 (날짜를 누르면 기록을 확인해요!)
            </h2>
            <div class="flex justify-between items-center mb-2">
                <button onclick="changeMonth(-1)" class="px-2.5 py-0.5 bg-sky-100 text-sky-700 rounded-lg font-title text-xs">&lt; 이전</button>
                <span id="calendar-month-year" class="text-base text-slate-700 font-title"></span>
                <button onclick="changeMonth(1)" class="px-2.5 py-0.5 bg-sky-100 text-sky-700 rounded-lg font-title text-xs">다음 &gt;</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 mb-1 font-title">
                <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 flex-1 overflow-y-auto"></div>
        </section>

        <!-- 3. 전설 도감 섹션 -->
        <section id="sec-pokedex" class="hidden h-full flex flex-col">
            <h2 class="text-base text-amber-800 mb-3 flex items-center gap-2 bg-amber-100 p-2.5 rounded-xl border border-amber-200 flex-shrink-0">
                <span>📖</span> 전설의 포켓몬 도감
            </h2>
            <div id="pokedex-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5 overflow-y-auto pr-1 flex-1"></div>
        </section>

        <!-- 4. 일과 설정 섹션 -->
        <section id="sec-settings" class="hidden bg-white p-4 rounded-2xl border-2 border-sky-200 shadow-md h-full flex flex-col">
            <div class="flex justify-between items-center border-b border-sky-100 pb-2 mb-3 flex-shrink-0">
                <h2 class="text-base text-sky-700">⚙️ 훈련 영역 & 일과 관리</h2>
                <button onclick="addNewCategory()" class="bg-emerald-500 hover:bg-emerald-400 text-white text-xs px-2.5 py-1 rounded-lg shadow font-title">+ 새 영역 추가</button>
            </div>
            <div id="settings-category-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 overflow-y-auto pr-1 flex-1"></div>
        </section>

    </main>

    <!-- 상세 기록 모달 -->
    <div id="day-detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white border-4 border-sky-300 rounded-3xl p-5 max-w-sm w-full relative shadow-2xl">
            <div class="flex justify-between items-start border-b border-sky-100 pb-2 mb-3">
                <div>
                    <h3 id="detail-modal-date" class="text-lg text-sky-900"></h3>
                    <p class="text-xs text-sky-600 font-bold">완수한 훈련 리스트</p>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
            </div>
            
            <div id="detail-modal-content" class="space-y-1.5 max-h-52 overflow-y-auto mb-3 pr-1"></div>

            <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200 flex justify-between items-center text-xs text-amber-900">
                <span class="font-bold">획득 몬스터볼</span>
                <span id="detail-modal-balls" class="text-red-500 text-sm font-title">0개</span>
            </div>
        </div>
    </div>

    <!-- 포켓몬 포획 모달 -->
    <div id="catch-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gradient-to-b from-yellow-50 to-white border-4 border-yellow-400 rounded-3xl p-5 max-w-sm w-full text-center relative shadow-2xl">
            <h3 id="modal-title" class="text-xl text-amber-900 mb-1">✨ 전설의 포켓몬 등장!</h3>
            <div class="my-4 relative h-32 flex items-center justify-center">
                <div class="absolute inset-0 bg-yellow-200/50 rounded-full blur-xl animate-pulse"></div>
                <img id="modal-pokemon-img" class="w-28 h-28 object-contain silhouette transition-all duration-1000 relative z-10">
            </div>
            <p id="modal-desc" class="text-xs font-bold text-slate-600 mb-4">몬스터볼 100개를 사용하여 전설의 포켓몬을 포획하시겠습니까?</p>
            <div id="modal-actions" class="flex gap-2 justify-center font-title">
                <button id="modal-throw-btn" onclick="throwPokeball()" class="bg-red-500 hover:bg-red-400 text-white px-5 py-2 rounded-xl text-sm shadow">던지기!</button>
                <button onclick="closeCatchModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-600 px-4 py-2 rounded-xl text-sm">취소</button>
            </div>
        </div>
    </div>

                ]
            }
        ];

        let state = {
            categories: JSON.parse(localStorage.getItem('pk_categories')) || DEFAULT_CATEGORIES,
            ballCount: parseInt(localStorage.getItem('pk_ballCount')) || 0,
            completedHistory: JSON.parse(localStorage.getItem('pk_history')) || {},
            dailyBallHistory: JSON.parse(localStorage.getItem('pk_dailyBalls')) || {},
            caughtPokemon: JSON.parse(localStorage.getItem('pk_caught')) || {}
        };

        // 접속 시 실시간 현재 날짜 설정
        let currentDate = new Date();
        let calendarCurrentDate = new Date();
        let selectedPokemonForCatch = null;

        window.onload = () => {
            updateDateDisplay();
            renderTodayQuests();
            renderPokedex();
            updateBallCounter();
            renderSettings();
        };

        function saveState() {
            localStorage.setItem('pk_categories', JSON.stringify(state.categories));
            localStorage.setItem('pk_ballCount', state.ballCount);
            localStorage.setItem('pk_history', JSON.stringify(state.completedHistory));
            localStorage.setItem('pk_dailyBalls', JSON.stringify(state.dailyBallHistory));
            localStorage.setItem('pk_caught', JSON.stringify(state.caughtPokemon));
            updateBallCounter();
        }

        function getDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function updateDateDisplay() {
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            document.getElementById('current-date-display').innerText = 
                `${currentDate.getFullYear()}년 ${currentDate.getMonth()+1}월 ${currentDate.getDate()}일 (${days[currentDate.getDay()]})`;
        }

        function changeDate(delta) {
            currentDate.setDate(currentDate.getDate() + delta);
            updateDateDisplay();
            renderTodayQuests();
        }

        function resetToToday() {
            currentDate = new Date();
            updateDateDisplay();
            renderTodayQuests();
        }

        function updateBallCounter() {
            document.getElementById('ball-count').innerText = state.ballCount;
            document.getElementById('catch-btn').disabled = state.ballCount < 100;
        }

        function switchTab(tab) {
            ['today', 'calendar', 'pokedex', 'settings'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                const tabBtn = document.getElementById(`tab-${t}`);
                tabBtn.classList.remove('text-sky-600', 'border-b-2', 'border-sky-500', 'bg-sky-50');
                tabBtn.classList.add('text-slate-400');
            });
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('text-sky-600', 'border-b-2', 'border-sky-500', 'bg-sky-50');
            activeBtn.classList.remove('text-slate-400');

            if(tab === 'calendar') renderCalendar();
            if(tab === 'pokedex') renderPokedex();
        }

        function renderTodayQuests() {
            const container = document.getElementById('quest-list-container');
            container.innerHTML = '';
            const dayOfWeek = currentDate.getDay();
            const dateKey = getDateKey(currentDate);
            const todayDoneList = state.completedHistory[dateKey] || [];

            state.categories.forEach((cat, cIdx) => {
                const activeItems = cat.items.filter(item => item.days.includes(dayOfWeek));
                if (activeItems.length === 0) return;

                const catEl = document.createElement('div');
                catEl.className = "bg-white p-3.5 rounded-2xl border-2 border-sky-200 shadow-sm flex flex-col justify-between";
                catEl.innerHTML = `<h3 class="text-base text-sky-800 mb-2 flex items-center gap-1.5 font-title">${cat.title}</h3>`;

                const listEl = document.createElement('div');
                listEl.className = "space-y-1.5";

                activeItems.forEach((item, iIdx) => {
                    const itemId = item.id || `${cat.id}_${iIdx}`;
                    const isChecked = todayDoneList.some(done => done.id === itemId || done.name === item.name);

                    const itemEl = document.createElement('label');
                    itemEl.className = `flex items-center justify-between p-2.5 rounded-xl border transition cursor-pointer ${
                        isChecked 
                        ? 'bg-emerald-50 border-emerald-300 text-slate-400' 
                        : 'bg-sky-50/50 border-sky-100 hover:border-sky-300 text-slate-700'
                    }`;
                    itemEl.innerHTML = `
                        <span class="${isChecked ? 'line-through text-slate-400' : 'text-slate-800 font-bold'} text-xs sm:text-sm">${item.name}</span>
                        <input type="checkbox" ${isChecked ? 'checked' : ''} 
                               onchange="toggleQuest('${itemId}', '${item.name.replace(/'/g, "\\'")}')"
                               class="w-5 h-5 rounded-md accent-yellow-400 cursor-pointer">
                    `;
                    listEl.appendChild(itemEl);
                });

                catEl.appendChild(listEl);
                container.appendChild(catEl);
            });
        }

        function toggleQuest(itemId, itemName) {
            const dateKey = getDateKey(currentDate);
            if (!state.completedHistory[dateKey]) state.completedHistory[dateKey] = [];

            const history = state.completedHistory[dateKey];
            const index = history.findIndex(done => done.id === itemId || done.name === itemName);

            if (index > -1) {
                history.splice(index, 1);
                state.ballCount = Math.max(0, state.ballCount - 1);
                state.dailyBallHistory[dateKey] = Math.max(0, (state.dailyBallHistory[dateKey] || 1) - 1);
            } else {
                history.push({ id: itemId, name: itemName });
                state.ballCount += 1;
                state.dailyBallHistory[dateKey] = (state.dailyBallHistory[dateKey] || 0) + 1;
            }

            saveState();
            renderTodayQuests();
        }

        function changeMonth(delta) {
            calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = calendarCurrentDate.getFullYear();
            const month = calendarCurrentDate.getMonth();
            document.getElementById('calendar-month-year').innerText = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let date = 1; date <= lastDate; date++) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                const ballsObtained = state.dailyBallHistory[dateKey] || 0;

                const cell = document.createElement('div');
                cell.className = "bg-sky-50/60 border border-sky-100 rounded-lg p-1 min-h-[48px] flex flex-col justify-between items-center text-[11px] cursor-pointer hover:bg-sky-100 transition active:scale-95";
                cell.onclick = () => openDayDetailModal(dateKey);
                cell.innerHTML = `
                    <span class="text-slate-500 font-bold self-start font-title">${date}</span>
                    ${ballsObtained > 0 ? `
                        <div class="flex items-center gap-0.5 text-red-500 font-title text-[10px]">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" class="w-3 h-3">
                            +${ballsObtained}
                        </div>
                    ` : ''}
                `;
                grid.appendChild(cell);
            }
        }

        function openDayDetailModal(dateKey) {
            document.getElementById('detail-modal-date').innerText = dateKey;
            const doneList = state.completedHistory[dateKey] || [];
            const balls = state.dailyBallHistory[dateKey] || 0;

            const contentEl = document.getElementById('detail-modal-content');
            contentEl.innerHTML = '';

            if (doneList.length === 0) {
                contentEl.innerHTML = `<p class="text-xs text-slate-400 py-3 text-center font-bold">완수한 훈련이 없습니다.</p>`;
            } else {
                doneList.forEach(item => {
                    const itemBox = document.createElement('div');
                    itemBox.className = "bg-emerald-50 border border-emerald-200 p-2 rounded-lg text-xs font-bold text-emerald-800 flex items-center gap-1.5";
                    itemBox.innerHTML = `<span>✅</span><span>${item.name || item}</span>`;
                    contentEl.appendChild(itemBox);
                });
            }

            document.getElementById('detail-modal-balls').innerText = `${balls}개`;
            document.getElementById('day-detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('day-detail-modal').classList.add('hidden');
        }

        function renderPokedex() {
            const grid = document.getElementById('pokedex-grid');
            grid.innerHTML = '';

            LEGENDARY_POKEMON.forEach(p => {
                const isCaught = !!state.caughtPokemon[p.id];
                const caughtDate = state.caughtPokemon[p.id];

                const card = document.createElement('div');
                card.className = `p-2 rounded-xl border flex flex-col items-center text-center shadow-sm ${
                    isCaught ? 'bg-gradient-to-b from-yellow-50 to-amber-50 border-yellow-300' : 'bg-white border-slate-100'
                }`;

                card.innerHTML = `
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png" 
                         alt="${p.name}" class="w-14 h-14 object-contain mb-1 ${isCaught ? '' : 'silhouette opacity-30'}">
                    <span class="text-[11px] font-title ${isCaught ? 'text-amber-900' : 'text-slate-400'}">${p.name}</span>
                    <span class="text-[9px] font-bold ${isCaught ? 'text-amber-600' : 'text-slate-300'}">${isCaught ? caughtDate : '미포획'}</span>
                `;
                grid.appendChild(card);
            });
        }

        function openCatchModal() {
            if (state.ballCount < 100) return;

            // 미획득 포켓몬 필터링 (100% 중복 방지)
            const unCaught = LEGENDARY_POKEMON.filter(p => !state.caughtPokemon[p.id]);
            if (unCaught.length === 0) {
                alert('모든 전설의 포켓몬을 수집하셨습니다! 🏆');
                return;
            }

            selectedPokemonForCatch = unCaught[Math.floor(Math.random() * unCaught.length)];
            
            const img = document.getElementById('modal-pokemon-img');
            img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${selectedPokemonForCatch.id}.png`;
            img.classList.add('silhouette');
            
            document.getElementById('modal-title').innerText = '✨ 전설의 포켓몬 등장!';
            document.getElementById('modal-desc').innerText = '몬스터볼 100개를 사용해 잡으시겠습니까?';
            document.getElementById('modal-actions').classList.remove('hidden');

            document.getElementById('catch-modal').classList.remove('hidden');
        }

        function throwPokeball() {
            state.ballCount -= 100;
            const dateKey = getDateKey(currentDate);
            
            // 100% 포획 및 도감 등록
            state.caughtPokemon[selectedPokemonForCatch.id] = dateKey;
            saveState();

            document.getElementById('modal-actions').classList.add('hidden');
            document.getElementById('modal-title').innerText = '🎉 축하합니다!';
            document.getElementById('modal-desc').innerText = `전설의 포켓몬 [${selectedPokemonForCatch.name}]을(를) 잡았습니다!`;

            const img = document.getElementById('modal-pokemon-img');
            img.classList.remove('silhouette');

            setTimeout(() => {
                closeCatchModal();
                switchTab('pokedex');
            }, 2200);
        }

        function closeCatchModal() {
            document.getElementById('catch-modal').classList.add('hidden');
        }

        function renderSettings() {
            const container = document.getElementById('settings-category-list');
            container.innerHTML = '';

            state.categories.forEach((cat, cIdx) => {
                const catBox = document.createElement('div');
                catBox.className = "bg-sky-50/50 p-3 rounded-xl border border-sky-200 space-y-2";
                
                catBox.innerHTML = `
                    <div class="flex justify-between items-center gap-2">
                        <input type="text" value="${cat.title}" onchange="updateCatTitle(${cIdx}, this.value)" 
                               class="bg-white border border-sky-300 rounded-lg px-2 py-0.5 text-xs font-title text-sky-800 w-full shadow-sm">
                        <button onclick="deleteCategory(${cIdx})" class="bg-rose-500 hover:bg-rose-600 text-[11px] px-2 py-0.5 rounded-lg text-white font-title shadow-sm">삭제</button>
                    </div>
                    <div class="space-y-1.5 pl-2 border-l-2 border-sky-200">
                        ${cat.items.map((item, iIdx) => `
                            <div class="flex flex-col gap-1 bg-white p-2 rounded-lg border border-sky-100 shadow-sm">
                                <div class="flex justify-between items-center gap-1.5">
                                    <input type="text" value="${item.name}" onchange="updateItemName(${cIdx}, ${iIdx}, this.value)" 
                                           class="bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5 text-xs font-bold text-slate-700 w-full">
                                    <button onclick="deleteItem(${cIdx}, ${iIdx})" class="text-xs text-rose-500 font-bold px-1">✕</button>
                                </div>
                                <div class="flex gap-1 text-[10px] font-title text-slate-400 mt-0.5">
                                    ${['일','월','화','수','목','금','토'].map((d, dIdx) => `
                                        <button onclick="toggleItemDay(${cIdx}, ${iIdx}, ${dIdx})" 
                                                class="px-1.5 py-0.5 rounded ${item.days.includes(dIdx) ? 'bg-amber-400 text-slate-900 font-extrabold' : 'bg-slate-100 text-slate-400'}">
                                            ${d}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                        <button onclick="addNewItem(${cIdx})" class="text-[11px] text-emerald-600 font-bold hover:underline font-title">+ 항목 추가</button>
                    </div>
                `;
                container.appendChild(catBox);
            });
        }

        function updateCatTitle(cIdx, val) { state.categories[cIdx].title = val; saveState(); }
        function updateItemName(cIdx, iIdx, val) { state.categories[cIdx].items[iIdx].name = val; saveState(); }
        function toggleItemDay(cIdx, iIdx, day) {
            const days = state.categories[cIdx].items[iIdx].days;
            const idx = days.indexOf(day);
            if(idx > -1) days.splice(idx, 1);
            else days.push(day);
            saveState();
            renderSettings();
        }
        function addNewCategory() {
            state.categories.push({ id: 'cat_' + Date.now(), title: '✨ 새 수련 영역', items: [] });
            saveState();
            renderSettings();
        }
        function deleteCategory(cIdx) {
            if(confirm('이 영역을 삭제하시겠습니까?')) {
                state.categories.splice(cIdx, 1);
                saveState();
                renderSettings();
            }
        }
        function addNewItem(cIdx) {
            state.categories[cIdx].items.push({ id: 'item_' + Date.now(), name: '새 할 일', days: [0,1,2,3,4,5,6] });
            saveState();
            renderSettings();
        }
        function deleteItem(cIdx, iIdx) {
            state.categories[cIdx].items.splice(iIdx, 1);
            saveState();
            renderSettings();
        }
    </script>
</body>
</html>
